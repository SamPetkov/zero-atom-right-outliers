name: Build LaTeX PDFs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile Letter and Supplemental Material
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            supplement.tex
          working_directory: paper
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian
      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: manuscript-pdfs
          path: |
            paper/main.pdf
            paper/supplement.pdf
