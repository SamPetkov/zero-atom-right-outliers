name: Build unified manuscript

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile the unified REVTeX manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          work_in_root_file_dir: true
          texlive_version: 2026
          os: debian
      - name: Validate the compiled manuscript
        shell: bash
        run: |
          set -euo pipefail
          test -s paper/main.pdf
          test -f paper/main.log
          if grep -Eq 'LaTeX Warning: (There were undefined references|Citation .* undefined|Reference .* undefined)' paper/main.log; then
            echo 'The LaTeX build contains unresolved citations or references.' >&2
            exit 1
          fi
          if grep -q 'Overfull \\hbox' paper/main.log; then
            echo 'The LaTeX build contains an overfull box.' >&2
            exit 1
          fi
      - name: Upload the checked manuscript PDF
        uses: actions/upload-artifact@v7
        with:
          name: unified-manuscript
          path: paper/main.pdf
          if-no-files-found: error
