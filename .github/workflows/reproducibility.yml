name: Reproducibility Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-reproduction.txt
      - name: Run deterministic simulations
        run: python code/zero_atom_checks.py --outdir results/generated
      - name: Verify results
        run: python code/verify_zero_atom_results.py results/generated/zero_atom_results.json
      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: numerical-diagnostics
          path: results/generated/
